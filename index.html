<!DOCTYPE html>
<html lang="fr" style="color-scheme:light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Marmito — Recettes du monde entier</title>
  <meta name="description" content="Découvre les recettes du monde entier avec les quantités et un chrono intégré. Gratuit.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700;1,900&family=Raleway:wght@300;400;500;600;700&display=swap">
  <style>
    :root{
      --bg:#F5E6CC;--fg:#2A1800;--fg2:#A08060;
      --accent:#D46820;--accent-light:#FDEBD4;--accent-dark:#B04A08;
      --green:#5C3010;--green-mid:#7A4820;--green-light:#FDEBD4;
      --border:#E8D5B4;--card-bg:#FDF4E3;
      --shadow:0 2px 16px rgba(40,20,4,0.07);
      --timer-bg:#FFF8F0;--timer-done:#2A7A50;
      --grad-dark:linear-gradient(135deg,#7A4820 0%,#A06030 55%,#C07840 100%);
      --grad-accent:linear-gradient(135deg,#D46820 0%,#F09040 100%);
      color-scheme:light
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--fg);font-family:"Raleway",system-ui,sans-serif;font-size:15px;line-height:1.6;min-height:100vh}
    .header{background:var(--grad-dark);padding:14px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;box-shadow:0 3px 14px rgba(30,14,4,0.22)}
    .logo{font-family:"Playfair Display",Georgia,serif;font-weight:900;font-size:24px;color:#FAFAF5;letter-spacing:-0.5px}
    .logo span{color:var(--accent)}
    .main{max-width:640px;margin:0 auto;padding:20px 16px 60px;display:flex;flex-direction:column;gap:14px}
    .tagline{text-align:center;padding-block:6px 2px}
    .tagline h1{font-family:"Playfair Display",Georgia,serif;font-weight:700;font-style:italic;font-size:clamp(20px,5vw,26px);color:var(--fg);line-height:1.25;margin-bottom:5px}
    .tagline p{font-size:13px;color:var(--fg2)}
    .card{background:var(--card-bg);border:1px solid var(--border);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
    .card-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.09em;color:var(--fg2);margin-bottom:10px}
    .ingredient-field{border:1.5px solid var(--border);border-radius:10px;padding:9px 12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;cursor:text;background:var(--bg);min-height:46px}
    .ingredient-tag{display:inline-flex;align-items:center;gap:5px;background:var(--accent-light);color:var(--accent);border-radius:6px;padding:3px 8px 3px 10px;font-size:13px;font-weight:500}
    .ingredient-tag button{background:none;border:none;cursor:pointer;color:var(--accent);font-size:15px;line-height:1;padding:0;opacity:0.7}
    #ingredient-input{border:none;outline:none;background:transparent;color:var(--fg);font-family:inherit;font-size:14px;min-width:100px;flex:1}
    .chips{display:flex;flex-wrap:wrap;gap:7px}
    .chip{padding:6px 13px;border-radius:20px;border:1.5px solid var(--border);background:var(--bg);color:var(--fg2);font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;transition:all 0.15s}
    .chip:hover{border-color:var(--accent);color:var(--accent)}
    .chip.active{background:var(--green);border-color:var(--green);color:#FAFAF5}
    .btn-generate{width:100%;padding:14px;background:var(--grad-accent);color:#fff;border:none;border-radius:12px;font-family:"Playfair Display",Georgia,serif;font-weight:700;font-size:16px;cursor:pointer;box-shadow:0 3px 12px rgba(184,76,16,0.30)}
    .btn-row{display:flex;gap:10px}
    .btn-filter{flex:1;padding:13px 8px;background:var(--card-bg);color:var(--accent-dark);border:2px solid var(--accent);border-radius:12px;font-family:"Playfair Display",Georgia,serif;font-weight:700;font-size:14px;cursor:pointer}
    .result-card{border:2px solid var(--accent);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);display:none}
    .result-card.visible{display:block}
    .result-header{background:var(--green);padding:22px 18px 14px;text-align:center;font-size:64px}
    .result-body{background:var(--card-bg);padding:18px;display:flex;flex-direction:column;gap:14px}
    .ingredient-list{display:flex;flex-wrap:wrap;gap:5px}
    .ingredient-pill{background:var(--green-light);color:var(--green);border-radius:6px;padding:4px 9px;font-size:13px;font-weight:500}
    .steps{display:flex;flex-direction:column;gap:10px}
    .step{display:flex;gap:10px;align-items:flex-start;padding:10px;background:var(--bg);border-radius:8px}
    .btn-cooked{background:#2A7A50;color:#fff;border:none;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer;width:100%;margin-top:10px}
    .suggestions{margin-top:15px;padding-top:10px;border-top:1px solid var(--border)}
    .suggestion-item{font-size:13px;color:var(--accent);cursor:pointer;margin:4px 0}
  </style>
</head>
<body>
<header class="header">
  <div class="logo">Marm<span>i</span>to</div>
</header>
<main class="main">
  <div class="tagline">
    <h1>Qu’est-ce qu’on cuisine ce soir ?</h1>
    <p>Choisis ta cuisine, vide ton frigo ou trouve une recette express !</p>
  </div>
  
  <div class="card">
    <div class="card-label">Mode Vide-Frigo & Ingrédients</div>
    <div class="ingredient-field" id="ing-field">
      <input id="ingredient-input" type="text" placeholder="Ex: poulet, tomates..." onkeydown="handleIngKey(event)">
    </div>
    <button class="btn-cooked" onclick="generateFridgeRecipe()" style="background:var(--accent);margin-top:10px">🔍 Trouver une recette avec mon frigo</button>
  </div>

  <div class="card">
    <div class="card-label">Type de cuisine</div>
    <div class="chips">
      <button class="chip active" data-group="cuisine" onclick="selectChip(this)">Toutes</button>
      <button class="chip" data-group="cuisine" onclick="selectChip(this)">Italienne</button>
      <button class="chip" data-group="cuisine" onclick="selectChip(this)">Japonaise</button>
      <button class="chip" data-group="cuisine" onclick="selectChip(this)">Maghreb</button>
      <button class="chip" data-group="cuisine" onclick="selectChip(this)">Antilles</button>
    </div>
  </div>

  <div class="btn-row">
    <button class="btn-generate" onclick="generateRecipe()" style="flex:1">🎲 Surprends-moi</button>
    <button class="btn-filter" onclick="generateExpressRecipe()">⚡ Express (&lt;20 min)</button>
  </div>

  <div class="result-card" id="result-card">
    <div class="result-header" id="recipe-visual-banner">🍽️</div>
    <div class="result-body">
      <div>
        <h2 id="result-title" style="font-family:'Playfair Display',serif;margin-bottom:4px"></h2>
        <div id="result-region" style="font-size:12px;color:var(--fg2);text-transform:uppercase;margin-bottom:10px"></div>
      </div>
      <div>
        <div class="card-label">Ingrédients</div>
        <div class="ingredient-list" id="result-ingredients"></div>
      </div>
      <div>
        <div class="card-label">Préparation</div>
        <div class="steps" id="result-steps"></div>
      </div>
      <button class="btn-cooked" id="btn-cooked" onclick="markAsCooked()">✅ Je l'ai cuisiné</button>
      
      <div class="suggestions" id="suggestions-box">
        <div class="card-label">Du même chef (suggestions)</div>
        <div id="suggestions-list"></div>
      </div>
    </div>
  </div>
</main>

<script>
  // Tableau de recettes nettoyé (Doublon Groupe B supprimé + 3 recettes italiennes ajoutées)
  const recipes = [
    {
      title: "Poulet à la créole",
      region: "Antilles",
      type: "Plat principal",
      time: "45 min",
      diff: "Facile",
      serves: "4 personnes",
      ingredients: ["Poulet", "Tomates", "Oignons", "Ail", "Piment", "Citron vert"],
      steps: ["Mariner le poulet avec le citron et l'ail.", "Faire dorer le poulet dans une cocotte.", "Ajouter les tomates, oignons et piment.", "Mijoter 35 minutes."],
      emoji: "🍗"
    },
    {
      title: "Mafé (sauce arachide)",
      region: "Afrique subsaharienne",
      type: "Plat principal",
      time: "1h",
      diff: "Moyen",
      serves: "4 personnes",
      ingredients: ["Bœuf", "Pâte d'arachide", "Tomates", "Oignons"],
      steps: ["Faire dorer la viande.", "Ajouter les oignons et les tomates.", "Incorporer la pâte d'arachide diluée et mijoter 40 min."],
      emoji: "🥜"
    },
    {
      title: "Sauce arachide au poulet (Cameroun)",
      region: "Afrique subsaharienne",
      type: "Plat principal",
      time: "1h",
      diff: "Moyen",
      serves: "4 personnes",
      ingredients: ["Poulet", "Pâte d'arachide", "Tomates", "Oignons", "Ail"],
      steps: ["Faire revenir le poulet.", "Ajouter la sauce tomate et l'arachide.", "Mijoter à feu doux."],
      emoji: "🍲"
    },
    {
      title: "Chermoula de poisson (Maroc)",
      region: "Maghreb",
      type: "Plat principal",
      time: "40 min",
      diff: "Facile",
      serves: "4 personnes",
      ingredients: ["Poisson", "Coriandre", "Persil", "Ail", "Cumin", "Citron"],
      steps: ["Préparer la marinade chermoula.", "Mariner le poisson.", "Cuire au four."],
      emoji: "🐟"
    },
    {
      title: "Beignets de plantains (Alloco)",
      region: "Afrique subsaharienne",
      type: "Plat principal",
      time: "30 min",
      diff: "Facile",
      serves: "2 personnes",
      ingredients: ["Bananes plantain mûres", "Huile de friture", "Sel"],
      steps: ["Couper les plantains.", "Faire frire jusqu'à dorure."],
      emoji: "🍌"
    },
    {
      title: "Alloco et poisson frit",
      region: "Afrique subsaharienne",
      type: "Plat principal",
      time: "30 min",
      diff: "Facile",
      serves: "2 personnes",
      ingredients: ["Bananes plantain mûres", "Poisson", "Huile de friture"],
      steps: ["Frire l'alloco et le poisson séparément.", "Servir ensemble."],
      emoji: "🍌"
    },
    {
      title: "Soupe à l'ail de Provence",
      region: "Occidentale",
      type: "Plat principal",
      time: "45 min",
      diff: "Facile",
      serves: "4 personnes",
      ingredients: ["Ail", "Eau", "Huile d'olive", "Thym", "Œufs"],
      steps: ["Faire bouillir l'ail avec les herbes.", "Pocher un œuf par assiette."],
      emoji: "🧄"
    },
    {
      title: "Soupe à l'ail rose de Lautrec",
      region: "Occidentale",
      type: "Plat principal",
      time: "45 min",
      diff: "Facile",
      serves: "4 personnes",
      ingredients: ["Ail rose de Lautrec", "Bouillon", "Pain", "Fromage"],
      steps: ["Faire confire l'ail rose.", "Mixer et servir sur du pain gratiné."],
      emoji: "🧄"
    },
    // Nouvelles recettes Italiennes ajoutées (pour revenir à 10)
    {
      title: "Spaghetti Cacio e Pepe",
      region: "Italienne",
      type: "Plat principal",
      time: "15 min",
      diff: "Facile",
      serves: "2 personnes",
      ingredients: ["Spaghetti", "Pecorino romano", "Poivre noir en grains"],
      steps: ["Cuire les spaghetti al dente.", "Mélanger le pecorino râpé avec l'eau de cuisson et beaucoup de poivre pour créer une crème onctueuse."],
      emoji: "🍝"
    },
    {
      title: "Bruschetta Tomates & Basilic",
      region: "Italienne",
      type: "Entrée",
      time: "10 min",
      diff: "Facile",
      serves: "4 personnes",
      ingredients: ["Pain de campagne", "Tomates", "Ail", "Basilic", "Huile d'olive"],
      steps: ["Frotter le pain grillé avec de l'ail.", "Garnir de dés de tomates fraîches, basilic et filet d'huile d'olive."],
      emoji: "🍅"
    },
    {
      title: "Saltimbocca alla Romana",
      region: "Italienne",
      type: "Plat principal",
      time: "20 min",
      diff: "Moyen",
      serves: "4 personnes",
      ingredients: ["Escalopes de veau", "Jambon deઘ Parme", "Sauge", "Vin blanc", "Beurre"],
      steps: ["Fixer une feuille de sage et du jambon sur chaque escalope avec un pic.", "Poêler au beurre et déglacer au vin blanc."],
      emoji: "🥩"
    }
  ];

  let cur = null;

  function selectChip(c){
    document.querySelectorAll(".chip[data-group='"+c.dataset.group+"']").forEach(x=>x.classList.remove("active"));
    c.classList.add("active");
  }

  function handleIngKey(e) {
    if (e.key === 'Enter' && e.target.value.trim()) {
      e.preventDefault();
      const val = e.target.value.trim();
      const tag = document.createElement('span');
      tag.className = 'ingredient-tag';
      tag.innerHTML = val + '<button onclick="this.parentElement.remove()">×</button>';
      document.getElementById('ing-field').insertBefore(tag, e.target);
      e.target.value = '';
    }
  }

  function generateRecipe() {
    const cu = document.querySelector(".chip[data-group='cuisine'].active").textContent;
    let pool = recipes;
    if(cu !== "Toutes") pool = pool.filter(r => r.region === cu);
    cur = pool[Math.floor(Math.random() * pool.length)] || recipes[0];
    show(cur);
  }

  function generateExpressRecipe() {
    let pool = recipes.filter(r => parseInt(r.time) <= 20);
    if (!pool.length) pool = recipes;
    cur = pool[Math.floor(Math.random() * pool.length)];
    show(cur);
  }

  function generateFridgeRecipe() {
    const userIngs = [...document.querySelectorAll(".ingredient-tag")].map(t => t.childNodes[0].nodeValue.trim().toLowerCase());
    if(!userIngs.length) { alert("Ajoute au moins un ingrédient !"); return; }
    let scored = recipes.map(r => ({
      r, score: r.ingredients.filter(i => userIngs.some(u => i.toLowerCase().includes(u))).length
    }));
    scored.sort((a,b) => b.score - a.score);
    cur = scored[0].r;
    show(cur);
  }

  function show(r) {
    cur = r;
    document.getElementById("result-title").textContent = r.title;
    document.getElementById("result-region").textContent = r.region + " · " + r.type + " · " + r.time;
    document.getElementById("recipe-visual-banner").textContent = r.emoji || "🍽️";
    document.getElementById("result-ingredients").innerHTML = r.ingredients.map(i => `<span class="ingredient-pill">${i}</span>`).join("");
    document.getElementById("result-steps").innerHTML = r.steps.map((s, i) => `<div class="step"><strong>${i+1}.</strong> ${s}</div>`).join("");
    
    // Suggestions "Du même chef" (2 autres de la même région)
    const sameRegion = recipes.filter(x => x.region === r.region && x.title !== r.title).slice(0, 2);
    document.getElementById("suggestions-list").innerHTML = sameRegion.map(s => `<div class="suggestion-item" onclick="show(recipes.find(x=>x.title==='${s.title}'))">👉 ${s.title}</div>`).join("") || "Aucune autre suggestion pour cette région.";

    document.getElementById("result-card").classList.add("visible");
  }

  function markAsCooked() {
    let cooked = [];
    try { cooked = JSON.parse(localStorage.getItem('marmito-cooked') || '[]'); } catch(e){}
    if (!cooked.includes(cur.title)) {
      cooked.push(cur.title);
      localStorage.setItem('marmito-cooked', JSON.stringify(cooked));
    }
    const btn = document.getElementById("btn-cooked");
    btn.textContent = "✅ Recette cuisinée et enregistrée !";
    btn.style.background = "#1B4D3E";
  }
</script>
</body>
</html>
