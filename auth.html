<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marmito — Connexion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,700;0,900;1,700&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#F5E6CC;--fg:#2A1800;--fg2:#A08060;
  --accent:#D46820;--accent-light:#FDEBD4;--accent-dark:#B04A08;
  --brown:#5C3010;--brown-mid:#7A4820;
  --border:#E8D5B4;--card-bg:#FDF4E3;
  --shadow:0 2px 16px rgba(40,20,4,0.10);
  --grad-dark:linear-gradient(135deg,#7A4820 0%,#A06030 55%,#C07840 100%);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'DM Sans',sans-serif;
  background:var(--bg);
  color:var(--fg);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:16px;
}

/* Logo + tagline */
.auth-logo{
  font-family:'Fraunces',Georgia,serif;
  font-weight:900;
  font-size:2.2rem;
  color:#FAFAF5;
  letter-spacing:-0.5px;
  text-align:center;
  margin-bottom:4px;
  background:var(--grad-dark);
  padding:18px 36px 14px;
  border-radius:20px 20px 0 0;
  width:100%;
  max-width:420px;
}
.auth-logo span{color:#F5C080}
.tagline{
  color:#FAFAF5;
  font-size:0.82rem;
  text-align:center;
  background:var(--grad-dark);
  padding:0 36px 18px;
  width:100%;
  max-width:420px;
  opacity:0.85;
  border-radius:0;
}

/* Card */
.card{
  background:var(--card-bg);
  border:1.5px solid var(--border);
  border-radius:0 0 18px 18px;
  padding:28px 28px 24px;
  width:100%;
  max-width:420px;
  box-shadow:var(--shadow);
}

/* Tabs */
.tabs{display:flex;gap:0;border-bottom:2px solid var(--border);margin-bottom:22px}
.tab{
  flex:1;padding:9px;text-align:center;
  font-size:0.93rem;font-weight:600;cursor:pointer;
  color:var(--fg2);border-bottom:2.5px solid transparent;
  margin-bottom:-2px;transition:all 0.18s;
}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}

/* Fields */
.field{margin-bottom:14px}
.field label{display:block;font-size:0.83rem;font-weight:500;color:var(--fg2);margin-bottom:5px}
.field input{
  width:100%;padding:11px 13px;
  border:1.5px solid var(--border);border-radius:10px;
  font-size:0.95rem;font-family:inherit;
  background:#FFFAF4;color:var(--fg);
  outline:none;transition:border-color 0.18s;
}
.field input:focus{border-color:var(--accent)}

/* Buttons */
.btn-primary{
  width:100%;padding:13px;
  background:var(--accent);color:#fff;
  border:none;border-radius:10px;
  font-size:1rem;font-weight:700;font-family:'Fraunces',Georgia,serif;
  cursor:pointer;transition:background 0.18s,filter 0.18s;
  margin-top:4px;letter-spacing:0.01em;
  box-shadow:0 2px 8px rgba(184,76,16,0.20);
}
.btn-primary:hover{background:var(--accent-dark)}
.btn-primary:disabled{opacity:0.55;cursor:not-allowed}

.divider{display:flex;align-items:center;gap:12px;margin:18px 0;color:var(--fg2);font-size:0.83rem}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border)}

.btn-google{
  width:100%;padding:11px;
  background:var(--card-bg);
  border:1.5px solid var(--border);border-radius:10px;
  font-size:0.93rem;font-weight:500;font-family:inherit;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;
  color:var(--fg);transition:border-color 0.18s,background 0.18s;
}
.btn-google:hover{border-color:var(--accent);background:var(--accent-light)}
.btn-google svg{width:20px;height:20px;flex-shrink:0}

/* Messages */
.msg{padding:10px 13px;border-radius:8px;font-size:0.88rem;margin-bottom:14px;display:none}
.msg.error{background:#FEE8E0;color:#B03000;border:1px solid #F0C0A0;display:block}
.msg.success{background:#E8F5E9;color:#2D7A4E;border:1px solid #B8DFC4;display:block}

/* Footer */
.footer-note{text-align:center;font-size:0.78rem;color:var(--fg2);margin-top:16px;max-width:420px}
.footer-note a{color:var(--accent);text-decoration:none}

/* Marmito V59 — harmonisation visuelle avec landing et index */
:root{--bg:#faf6ee;--fg:#193c29;--fg2:#657565;--accent:#c94715;--accent-light:#fbe9dc;--accent-dark:#a9360b;--brown:#214a32;--brown-mid:#315a3d;--border:#dce4d4;--card-bg:#fffdf8;--shadow:0 18px 50px rgba(27,58,36,.10);--grad-dark:linear-gradient(125deg,#123d2a,#315d3c)}
body{background:radial-gradient(ellipse at 15% 10%,#e8efdf 0,transparent 45%),radial-gradient(ellipse at 95% 95%,#fae8d9 0,transparent 38%),var(--bg);padding:28px 16px}
.auth-logo{font-family:Georgia,'Fraunces',serif;color:#fff;border-radius:22px 22px 0 0;letter-spacing:.035em;padding:25px 32px 9px;background:var(--grad-dark);max-width:460px}
.auth-logo span{color:#f2c8a0}
.tagline{max-width:460px;background:var(--grad-dark);opacity:1;color:#e9f1e7;padding:0 26px 24px;letter-spacing:.015em}
.card{max-width:460px;border-radius:0 0 22px 22px;padding:30px 32px 28px;box-shadow:var(--shadow)}
.tab.active{color:#174b30;border-bottom-color:#c94715}
.field label{color:#355643}
.field input{background:#fff;color:#193c29}
.field input:focus{border-color:#c94715;box-shadow:0 0 0 3px #c9471520}
.btn-primary{border-radius:999px;font-family:'DM Sans',sans-serif;background:#c94715;font-weight:700;min-height:48px}
.btn-primary:hover{background:#a9360b}
.btn-google{border-radius:999px;min-height:46px;background:#fff}
.footer-note a{color:#a9360b}
@media(max-width:480px){.card{padding:24px 20px}.auth-logo{font-size:2rem}}
</style>
</head>
<body>

<div class="auth-logo">Marmi<span>to</span></div>
<p class="tagline">Cuisines du monde, une recette a la fois</p>

<div class="card">
  <div class="tabs">
    <div class="tab active" onclick="switchTab('login')">Connexion</div>
    <div class="tab" onclick="switchTab('signup')">Inscription</div>
  </div>

  <div id="msg" class="msg"></div>

  <div id="login-form">
    <div class="field">
      <label>Adresse courriel</label>
      <input type="email" id="login-email" placeholder="vous@exemple.com" autocomplete="email">
    </div>
    <div class="field">
      <label>Mot de passe</label>
      <input type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn-primary" id="btn-login" onclick="doLogin()">Se connecter</button>
    <button type="button" id="forgot-link" onclick="showRecoveryForm()" style="display:block;margin:14px auto 0;background:none;border:0;color:#a9360b;text-decoration:underline;cursor:pointer;font:inherit">Mot de passe oublié ?</button>
  </div>

  <div id="recovery-form" style="display:none">
    <div class="field">
      <label for="recovery-email">Adresse courriel de votre compte</label>
      <input type="email" id="recovery-email" placeholder="vous@exemple.com" autocomplete="email">
    </div>
    <button class="btn-primary" id="btn-recovery" onclick="sendPasswordReset()">Envoyer le lien de réinitialisation</button>
    <button type="button" onclick="switchTab('login')" style="display:block;margin:14px auto 0;background:none;border:0;color:#a9360b;cursor:pointer;font:inherit">Retour à la connexion</button>
  </div>

  <div id="new-password-form" style="display:none">
    <div class="field">
      <label for="new-password">Nouveau mot de passe (8 caractères minimum)</label>
      <input type="password" id="new-password" autocomplete="new-password" minlength="8">
    </div>
    <div class="field">
      <label for="confirm-password">Confirmer le nouveau mot de passe</label>
      <input type="password" id="confirm-password" autocomplete="new-password" minlength="8">
    </div>
    <button class="btn-primary" id="btn-new-password" onclick="saveNewPassword()">Enregistrer le nouveau mot de passe</button>
  </div>

  <div id="signup-form" style="display:none">
    <div class="field">
      <label>Adresse courriel</label>
      <input type="email" id="signup-email" placeholder="vous@exemple.com" autocomplete="email">
    </div>
    <div class="field">
      <label>Mot de passe (8 caracteres min.)</label>
      <input type="password" id="signup-pass" placeholder="••••••••" autocomplete="new-password">
    </div>
    <button class="btn-primary" id="btn-signup" onclick="doSignup()">Creer mon compte</button>
  </div>

  <div class="divider">ou</div>

  <button class="btn-google" onclick="doGoogle()">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
      <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
      <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
      <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
    </svg>
    Continuer avec Google
  </button>
</div>

<p class="footer-note">En vous inscrivant, vous acceptez nos <a href="#">conditions d'utilisation</a>.</p>

<script>
const SUPABASE_URL = 'https://osfhpzgfqpbzyrbjkajk.supabase.co';
const SUPABASE_KEY = 'sb_publishable_HAduBBuXWYfdKvOnfZ7X-Q_liL5Xj7h';
// V107.31 OAuth 4 : retour implicite traité explicitement, une seule fois.
// Capturer le fragment AVANT toute initialisation de Supabase.
const oauthFragment = window.location.hash.startsWith('#')
  ? new URLSearchParams(window.location.hash.slice(1)) : new URLSearchParams();
const oauthAccessToken = oauthFragment.get('access_token');
const oauthRefreshToken = oauthFragment.get('refresh_token');
const oauthError = oauthFragment.get('error_description') || oauthFragment.get('error');
const recoveryReturn = new URLSearchParams(location.search).get('mode') === 'reset'
  || oauthFragment.get('type') === 'recovery';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { flowType: 'implicit', detectSessionInUrl: false, persistSession: true, autoRefreshToken: true }
});
// Conserver le parrainage de la version précédente.
const inviteCode = new URLSearchParams(location.search).get('ref');
if (inviteCode && /^[A-Z0-9]{6,24}$/i.test(inviteCode)) {
  try { localStorage.setItem('marmito-pending-ref', inviteCode.toUpperCase()); } catch(e) {}
}
let authNavigationStarted = false;
let passwordRecoveryActive = recoveryReturn;
function goToAppOnce(session) {
  if (!session?.access_token || !session?.user || authNavigationStarted) return;
  if (recoveryReturn || passwordRecoveryActive) return;
  authNavigationStarted = true;
  window.location.replace('/');
}
function oauthFailure(message) {
  showMsg('Connexion Google non finalisée : ' + message, 'error');
}
async function finishAuthReturn() {
  // Les jetons ne doivent pas rester dans l'historique ni dans l'URL visible.
  if (oauthAccessToken || oauthRefreshToken || oauthError) {
    window.history.replaceState(null, '', window.location.pathname);
  }
  if (oauthError) {
    if (recoveryReturn) showMsg('Lien de réinitialisation invalide ou expiré. Demandez un nouveau lien.', 'error');
    else oauthFailure('Google a refusé la connexion. Réessayez.');
    return;
  }
  const hasOAuthTokens = Boolean(oauthAccessToken || oauthRefreshToken);
  if (hasOAuthTokens) showMsg('Connexion Google en cours...', 'success');
  try {
    if (hasOAuthTokens) {
      if (!oauthAccessToken || !oauthRefreshToken) {
        oauthFailure('réponse Google incomplète. Réessayez.'); return;
      }
      // setSession valide les jetons et persiste la session via Supabase JS.
      const {data, error} = await sb.auth.setSession({
        access_token: oauthAccessToken, refresh_token: oauthRefreshToken
      });
      if (error) throw error;
      if (data?.session) {
        if (recoveryReturn) { showNewPasswordForm(); return; }
        goToAppOnce(data.session); return;
      }
      oauthFailure('session non créée après le retour Google. Réessayez.');
      return;
    }
    // Navigation ordinaire vers auth.html : ne pas déclencher de fausse erreur.
    const {data, error} = await sb.auth.getSession();
    if (error) throw error;
    if (recoveryReturn) {
      if (data?.session) showNewPasswordForm();
      else showMsg('Lien de réinitialisation expiré ou non reconnu. Demandez un nouveau lien.', 'error');
    } else if (data?.session) goToAppOnce(data.session);
  } catch (error) {
    // Ne jamais afficher les jetons ou l'URL complète dans les erreurs.
    console.error('Marmito OAuth : échec de finalisation (détails sensibles masqués)');
    oauthFailure('impossible de créer la session. Réessayez.');
  }
}
sb.auth.onAuthStateChange((event, session) => {
  if (event === 'PASSWORD_RECOVERY') {
    passwordRecoveryActive = true;
    showNewPasswordForm();
  } else if (event === 'SIGNED_IN' && session && !passwordRecoveryActive) goToAppOnce(session);
});
finishAuthReturn();

function switchTab(tab){
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',i===(tab==='login'?0:1)));
  document.getElementById('login-form').style.display=tab==='login'?'':'none';
  document.getElementById('signup-form').style.display=tab==='signup'?'':'none';
  document.getElementById('recovery-form').style.display='none';
  document.getElementById('new-password-form').style.display='none';
  document.querySelector('.tabs').style.display='';
  clearMsg();
}

function showMsg(text,type){
  const el=document.getElementById('msg');
  el.textContent=text;el.className='msg '+type;
}
function clearMsg(){
  const el=document.getElementById('msg');
  el.className='msg';el.textContent='';
}

function showRecoveryForm(){
  document.getElementById('login-form').style.display='none';
  document.getElementById('signup-form').style.display='none';
  document.getElementById('recovery-form').style.display='';
  document.getElementById('new-password-form').style.display='none';
  document.getElementById('recovery-email').value=document.getElementById('login-email').value.trim();
  clearMsg();
}
function showNewPasswordForm(){
  passwordRecoveryActive=true;
  document.querySelector('.tabs').style.display='none';
  document.getElementById('login-form').style.display='none';
  document.getElementById('signup-form').style.display='none';
  document.getElementById('recovery-form').style.display='none';
  document.getElementById('new-password-form').style.display='';
  showMsg('Choisissez votre nouveau mot de passe.', 'success');
}
async function sendPasswordReset(){
  const email=document.getElementById('recovery-email').value.trim();
  if(!email){showMsg('Indiquez votre adresse courriel.','error');return;}
  const btn=document.getElementById('btn-recovery');
  btn.disabled=true;btn.textContent='Envoi...';
  try {
    const {error}=await sb.auth.resetPasswordForEmail(email,{
      redirectTo:window.location.origin+'/auth.html?mode=reset'
    });
    if(error) throw error;
    showMsg('Si cette adresse correspond à un compte, un lien de réinitialisation sera envoyé. Vérifiez aussi les courriels indésirables.','success');
  } catch(e) {
    showMsg('Impossible d’envoyer le lien pour le moment. Réessayez.','error');
  } finally {
    btn.disabled=false;btn.textContent='Envoyer le lien de réinitialisation';
  }
}
async function saveNewPassword(){
  const password=document.getElementById('new-password').value;
  const confirmation=document.getElementById('confirm-password').value;
  if(password.length<8){showMsg('Le mot de passe doit contenir au moins 8 caractères.','error');return;}
  if(password!==confirmation){showMsg('Les deux mots de passe ne correspondent pas.','error');return;}
  const btn=document.getElementById('btn-new-password');
  btn.disabled=true;btn.textContent='Enregistrement...';
  try {
    const {data,error:sessionError}=await sb.auth.getSession();
    if(sessionError || !data?.session) throw new Error('no recovery session');
    const {error}=await sb.auth.updateUser({password});
    if(error) throw error;
    // Conserver la session courante et terminer sur l'application.
    passwordRecoveryActive=false;
    authNavigationStarted=true;
    window.location.replace('/');
  } catch(e) {
    showMsg('Réinitialisation impossible ou lien expiré. Demandez un nouveau lien.','error');
    btn.disabled=false;btn.textContent='Enregistrer le nouveau mot de passe';
  }
}

async function doLogin(){
  const email=document.getElementById('login-email').value.trim();
  const pass=document.getElementById('login-pass').value;
  if(!email||!pass){showMsg('Remplissez tous les champs.','error');return;}
  const btn=document.getElementById('btn-login');
  btn.disabled=true;btn.textContent='Connexion...';
  const{error}=await sb.auth.signInWithPassword({email,password:pass});
  if(error){showMsg(error.message,'error');btn.disabled=false;btn.textContent='Se connecter';}
  else window.location.href='/';
}

async function doSignup(){
  const email=document.getElementById('signup-email').value.trim();
  const pass=document.getElementById('signup-pass').value;
  if(!email||!pass){showMsg('Remplissez tous les champs.','error');return;}
  if(pass.length<8){showMsg('Le mot de passe doit avoir au moins 8 caracteres.','error');return;}
  const btn=document.getElementById('btn-signup');
  btn.disabled=true;btn.textContent='Creation...';
  // V61 : transmettre le code en métadonnées, en plus du stockage local.
  // La validation et l'association définitive restent du ressort de la RPC Supabase.
  let referralCode = null;
  try { referralCode = localStorage.getItem('marmito-pending-ref'); } catch(e) {}
  if (referralCode && !/^[A-Z0-9]{6,24}$/.test(referralCode)) referralCode = null;
  const signupOptions = referralCode ? { data: { marmito_referral_code: referralCode } } : {};
  const{error}=await sb.auth.signUp({email,password:pass,options:signupOptions});
  if(error){showMsg(error.message,'error');btn.disabled=false;btn.textContent='Creer mon compte';}
  else showMsg('Compte cree ! Verifiez votre courriel pour confirmer.','success');
}

async function doGoogle(){
  const{error}=await sb.auth.signInWithOAuth({
    provider:'google',
    options:{redirectTo:window.location.origin+'/auth.html',queryParams:{prompt:'select_account'}}
  });
  if(error)showMsg(error.message,'error');
}

document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const loginVisible=document.getElementById('login-form').style.display!=='none';
  if(document.getElementById('new-password-form').style.display!=='none')saveNewPassword();
  else if(document.getElementById('recovery-form').style.display!=='none')sendPasswordReset();
  else if(loginVisible)doLogin();else doSignup();
});

if(new URLSearchParams(location.search).get('signup')==='1')switchTab('signup');
</script>
</body>
</html>
